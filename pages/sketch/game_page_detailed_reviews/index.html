<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Game Detail - Red Dead Redemption II</title>
    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background-color: #1b1b1b;
            color: #ffffff;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
        }

        .container {
            display: flex;
            max-width: 1200px;
            width: 100%;
        }

        .content {
            flex: 2;
            margin-right: 20px;
        }

        .sidebar {
            flex: 1;
        }

        h1 {
            margin: 0;
            font-size: 32px;
        }

        .tabs {
            display: flex;
            margin: 20px 0;
            border-bottom: 1px solid #444;
        }

        .tab {
            padding: 10px 20px;
            cursor: pointer;
            color: #999;
            text-decoration: none;
        }

        .tab.active {
            color: #ffffff;
            border-bottom: 2px solid #0078ff;
        }

        .reviews {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .review {
            background-color: #282828;
            border-radius: 10px;
            padding: 20px;
            display: flex;
            align-items: flex-start;
            gap: 20px;
        }

        .review img {
            width: 50px;
            height: 50px;
            border-radius: 50%;
        }

        .review-content {
            flex: 1;
        }

        .review-content p {
            margin: 5px 0;
        }

        .rating {
            font-size: 14px;
            color: #ffcc00;
            font-weight: bold;
        }

        .likes {
            margin-top: 5px;
            color: #999;
            font-size: 12px;
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .game-image img {
            width: 100%;
            border-radius: 10px;
        }

        a {
            color: inherit;
        }

        .title-section {
            text-align: left;
            width: 100%;
            margin-bottom: 10px;
        }

        .title-section h2 {
            margin: 0;
            font-size: 18px;
            color: #999;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="content">
            <div class="title-section">
                <h2>Reviews of</h2>
            </div>
            <h1>Red Dead Redemption II </h1>
            <div class="tabs">
                <a href="/pages/game_page_detailed_liked_users/index.html" class="tab">LIKES</a>
                <a href="/pages/game_page_detailed_wishlist_users/index.html" class="tab">WISHLIST</a>
                <a href="/pages/game_page_detailed_reviews/index.html" class="tab active">REVIEWS</a>
                <a href="/pages/game_page_detailed_collections/index.html" class="tab">COLLECTIONS</a>
            </div>
            <div class="reviews">
                <div class="review">
                    <img src="/assets/images/profile-photo.png" alt="User avatar">
                    <div class="review-content">
                        <p class="rating">9/10</p>
                        <p>The game is amazing and underrated. Highly recommended!</p>
                        <div class="likes">
                            <span>1.5k Likes</span>
                        </div>
                    </div>
                </div>
                <div class="review">
                    <img src="/assets/images/profile-photo.png" alt="User avatar">
                    <div class="review-content">
                        <p class="rating">8/10</p>
                        <p>Great visuals and gameplay but lacks variety in missions.</p>
                        <div class="likes">
                            <span>1.2k Likes</span>
                        </div>
                    </div>
                </div>
            </div>
        </div>
        <div class="sidebar">
            <div class="game-image">
                <img src="https://m.media-amazon.com/images/M/MV5BZTM4YjFiMGEtZGFkYy00NjAwLWEwNjMtNWQwOWI5ZTAwMTgwXkEyXkFqcGc@._V1_.jpg" alt="Game cover">
            </div>
        </div>
    </div>
</body>
</html>
