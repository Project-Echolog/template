<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up</title>
    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background-color: #1b1b1b;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .popup {
            background-color: #282828;
            border-radius: 10px;
            padding: 30px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            width: 400px;
            text-align: center;
            color: #ffffff;
        }

        .popup h1 {
            margin: 0;
            margin-bottom: 20px;
            font-size: 24px;
        }

        .popup input {
            width: 95%;
            padding: 10px;
            margin: 10px 0;
            border: none;
            border-radius: 5px;
            background-color: #333333;
            color: #ffffff;
            font-size: 14px;
        }

        .popup button {
            width: 100%;
            padding: 10px;
            border: none;
            border-radius: 5px;
            background-color: #0078ff;
            color: #ffffff;
            font-size: 14px;
            cursor: pointer;
            margin-top: 10px;
        }

        .popup button:hover {
            background-color: #005fcc;
        }

        .popup a {
            color: #0078ff;
            text-decoration: none;
            font-size: 12px;
            display: inline-block;
            margin-top: 15px;
        }

        .popup a:hover {
            text-decoration: underline;
        }

        .divider {
            height: 1px;
            background-color: #444444;
            margin: 20px 0;
            border: none;
        }

        .success-message {
            color: #005fcc;
            font-size: 14px;
            margin-top: 15px;
            display: none;
        }
    </style>
</head>
<body>
    <form class="popup" action="/pages/login_page/index.html" method="get">
        <h1>SIGN UP</h1>
        <input type="email" name="email" placeholder="Email" required>
        <input type="text" name="nickname" placeholder="Nickname" required>
        <input type="password" name="password" placeholder="Password" required>
        <button type="submit" onclick="this.form.classList.add('redirecting')">Continue</button>
        <p class="success-message">Sign Up Succeeded</p>
        <hr class="divider">
        <a href="/pages/login_page/index.html">Have an account? Login</a>
    </form>
</body>
</html>
