<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Game Page - Wishlisted Users</title>
    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background-color: #1b1b1b;
            color: #ffffff;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
        }

        .container {
            display: flex;
            max-width: 1200px;
            width: 100%;
        }

        .content {
            flex: 2;
            margin-right: 20px;
        }

        .sidebar {
            flex: 1;
        }

        h1 {
            margin: 0;
            font-size: 32px;
        }

        .tabs {
            display: flex;
            margin: 20px 0;
            border-bottom: 1px solid #444;
        }

        .tab {
            padding: 10px 20px;
            cursor: pointer;
            color: #999;
            text-decoration: none;
        }

        .tab.active {
            color: #ffffff;
            border-bottom: 2px solid #0078ff;
        }

        .table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
        }

        .table th, .table td {
            padding: 12px 15px;
            text-align: left;
            vertical-align: middle;
        }

        .table th {
            background-color: #282828;
            font-size: 16px;
        }

        .table td {
            font-size: 14px;
            text-align: center; /* Center-align content in Wishlisted column */
        }

        .user-info {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .user-info img {
            width: 40px;
            height: 40px;
            border-radius: 50%;
        }

        .table td svg {
            width: 16px;
            height: 16px;
            vertical-align: middle;
            display: inline-block;
        }

        .game-image img {
            width: 100%;
            border-radius: 10px;
        }

        a {
            color: inherit;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="content">
            <h1>Everyone who wishlisted Red Dead Redemption II</h1>
            <div class="tabs">
                <a href="/pages/game_page_detailed_liked_users/index.html" class="tab">LIKES</a>
                <a href="/pages/game_page_detailed_wishlist_users/index.html" class="tab active">WISHLIST</a>
                <a href="/pages/game_page_detailed_reviews/index.html" class="tab">REVIEWS</a>
                <a href="/pages/game_page_detailed_collections/index.html" class="tab">COLLECTIONS</a>
            </div>
            <table class="table">
                <thead>
                    <tr>
                        <th>Name</th>
                        <th style="text-align: center;">Wishlisted</th>
                    </tr>
                </thead>
                <tbody>
                    <tr>
                        <td class="user-info">
                            <img src="/assets/images/profile-photo.png" alt="User avatar">
                            Ricky
                        </td>
                        <td style="color: #0078ff;"><svg xmlns="http://www.w3.org/2000/svg" fill="currentColor" class="bi bi-bookmark-fill" viewBox="0 0 16 16">
                            <path d="M2 2v13.5a.5.5 0 0 0 .74.439L8 13.069l5.26 2.87A.5.5 0 0 0 14 15.5V2a2 2 0 0 0-2-2H4a2 2 0 0 0-2 2"/>
                          </svg></td>
                    </tr>
                    <tr>
                        <td class="user-info">
                            <img src="/assets/images/profile-photo.png" alt="User avatar">
                            Deacon
                        </td>
                        <td style="color: #0078ff;"><svg xmlns="http://www.w3.org/2000/svg" fill="currentColor" class="bi bi-bookmark-fill" viewBox="0 0 16 16">
                            <path d="M2 2v13.5a.5.5 0 0 0 .74.439L8 13.069l5.26 2.87A.5.5 0 0 0 14 15.5V2a2 2 0 0 0-2-2H4a2 2 0 0 0-2 2"/>
                          </svg></td>
                    </tr>
                    <tr>
                        <td class="user-info">
                            <img src="/assets/images/profile-photo.png" alt="User avatar">
                            Joel
                        </td>
                        <td style="color: #0078ff;"><svg xmlns="http://www.w3.org/2000/svg" fill="currentColor" class="bi bi-bookmark-fill" viewBox="0 0 16 16">
                            <path d="M2 2v13.5a.5.5 0 0 0 .74.439L8 13.069l5.26 2.87A.5.5 0 0 0 14 15.5V2a2 2 0 0 0-2-2H4a2 2 0 0 0-2 2"/>
                          </svg></td>
                    </tr>
                </tbody>
            </table>
        </div>
        <div class="sidebar">
            <div class="game-image">
                <img src="https://m.media-amazon.com/images/M/MV5BZTM4YjFiMGEtZGFkYy00NjAwLWEwNjMtNWQwOWI5ZTAwMTgwXkEyXkFqcGc@._V1_.jpg" alt="Game cover">
            </div>
        </div>
    </div>
</body>
</html>
