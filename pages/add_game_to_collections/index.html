<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Add Games To Collections</title>
  <style>
    .popup {
      width: 450px;
      background-color: #2a3b4d;
      border-radius: 8px;
      padding: 20px;
      font-family: Arial, sans-serif;
      color: #fff;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.3);
      position: relative;
    }
    .popup-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
    }

    .popup-header h2 {
      margin: 0;
      font-size: 18px;
    }

    .popup-header .close-btn {
      font-size: 20px;
      background: none;
      border: none;
      color: #fff;
      cursor: pointer;
    }

    .collection-list {
      list-style: none;
      padding: 0;
      margin: 0 0 60px 0; /* Alt kısımdaki boşluk artırıldı */
    }

    .collection-list li {
      padding: 10px;
      margin-bottom: 8px;
      background-color: #3b4e62;
      border-radius: 4px;
      cursor: pointer;
      transition: background-color 0.2s ease;
    }

    .collection-list li:hover {
      background-color: #4e657a;
    }

    .add-btn {
      position: absolute;
      bottom: 20px;
      right: 20px;
      padding: 10px;
      background-color: #28a745;
      color: #fff;
      border: none;
      border-radius: 4px;
      text-align: center;
      font-size: 16px;
      cursor: pointer;
      transition: background-color 0.2s ease;
    }

    .add-btn:hover {
      background-color: #218838;
    }
  </style>
</head>
<body>
  <!-- Pop-Up -->
  <div class="popup">
    <div class="popup-header">
      <h2>Add "Red Dead Redemption II" to Collection</h2>
      <button class="close-btn">&times;</button>
    </div>
    <ul class="collection-list">
      <li>+ New Collection</li>
      <li>Test Collection</li>
    </ul>
    <button class="add-btn">Add</button>
  </div>
</body>
</html>
