<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="./style.css">
    <link href="https://fonts.cdnfonts.com/css/sf-pro-display" rel="stylesheet">
</head>

<body>
    <header></header>
    <main>
        <section class="search-bar">
            <input type="text" placeholder="Search Game" class="search-input">
        </section>

        <section class="must-have-games">
            <div class="carousel">
                <button class="prev">&lt;</button>
                <div class="carousel-items">
                    <div class="card">
                        <img src="god-of-war.jpg" alt="God of War">
                    </div>
                    <div class="card">
                        <img src="fallout-new-vegas.jpg" alt="Fallout New Vegas">
                    </div>
                    <div class="card">
                        <img src="red-dead-redemption.jpg" alt="Red Dead Redemption">
                    </div>
                    <div class="card">
                        <img src="death-stranding.jpg" alt="Death Stranding">
                    </div>
                    <div class="card">
                        <img src="silent-hill.jpg" alt="Silent Hill 2">
                    </div>
                </div>
                <button class="next">&gt;</button>
            </div>
        </section>
        <section></section>
        <section></section>
    </main>
    <footer></footer>
</body>

</html>
